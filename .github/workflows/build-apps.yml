name: Build PropManager installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version to stamp (e.g. 1.1.0). Leave empty to keep the current version.
        required: false
        default: ""
  # Also runs automatically after changes to this workflow itself.
  push:
    branches: [main]
    paths:
      - .github/workflows/build-apps.yml

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stamp version
        if: ${{ inputs.version != '' }}
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build desktop installers
        run: npx electron-builder --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: PropManager-installers-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect all build outputs
        uses: actions/download-artifact@v4
        with:
          pattern: PropManager-*
          merge-multiple: true
          path: release

      - name: Give the APK a friendly name
        run: mv release/app-release-signed.apk release/PropManager.apk || true

      - name: Publish to the 'latest' release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "PropManager — latest installable apps" \
              --latest \
              --notes "Installable apps built automatically from main.
          - Windows: PropManager-Setup-*.exe (installer) or .zip (portable)
          - macOS: .dmg (Apple Silicon arm64 + Intel x64)
          - Linux: .AppImage or .deb
          - Android: PropManager.apk"
          fi
          gh release view latest --repo "$GITHUB_REPOSITORY"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twa
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Android SDK
        run: echo "Using the Android SDK preinstalled on the runner at $ANDROID_SDK_ROOT"

      - name: Write Bubblewrap environment config
        run: |
          mkdir -p ~/.bubblewrap
          ln -sf "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" "$ANDROID_SDK_ROOT/bin"
          ln -sf "$ANDROID_SDK_ROOT/cmdline-tools/latest/lib" "$ANDROID_SDK_ROOT/lib"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          printf '%s' "{\"jdkPath\": \"$JAVA_HOME\", \"androidSdkPath\": \"$ANDROID_SDK_ROOT\", \"adbPath\": \"$ANDROID_SDK_ROOT/platform-tools/adb\"}" > ~/.bubblewrap/config.json

      - name: Install required SDK components
        run: |-
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SM="$(command -v sdkmanager)"
          fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-36" "build-tools;36.1.0"

      - name: Stamp version
        if: ${{ inputs.version != '' }}
        run: |
          cd ..
          npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
          V=$(node -p "require('./package.json').version")
          sed -i -e "s/\"appVersionName\": \"[^\"]*\"/\"appVersionName\": \"$V\"/" \
                 -e "s/\"appVersion\": \"[^\"]*\"/\"appVersion\": \"$V\"/" \
                 twa/twa-manifest.json

      - name: Always raise the Android version code
        run: |-
          sed -i "s/\"appVersionCode\": [0-9]*/\"appVersionCode\": ${{ github.run_number }}/" twa-manifest.json

      - name: Refresh manifest checksum
        run: |-
          sha1sum twa-manifest.json | cut -d' ' -f1 | tr -d '\n' > manifest-checksum.txt

      - name: Build signed APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: npx @bubblewrap/cli build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PropManager-android
          path: twa/app-release-signed.apk
          if-no-files-found: error
